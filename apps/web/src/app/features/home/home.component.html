<div class="home-page">

  <header class="home-greeting">
    <p class="home-hello">Bonjour</p>
    <h1 class="home-name">{{ firstName() }}</h1>
    <div class="home-sub">
      <span class="home-level">
        <span class="level-dots">
          @for (d of dots; track d) {
            <span class="level-dot" [class.active]="d <= (user()?.level ?? 1)"></span>
          }
        </span>
        <span class="home-level-label">{{ levelLabel() }}</span>
      </span>
      @if (onlineCount() > 0) {
        <span class="home-online">
          <span class="online-dot"></span>
          {{ onlineCount() }} {{ onlineCount() > 1 ? 'membres en ligne' : 'membre en ligne' }}
        </span>
      }
    </div>
  </header>

  <div class="widget-grid">
    @for (w of widgets; track w.id) {
      <a
        [routerLink]="w.route"
        [queryParams]="w.query ?? null"
        class="widget"
        [attr.data-tone]="w.tone"
        [style.background-image]="'url(/assets/img/w/' + w.img + '.webp)'"
      >
        <span class="widget-icon" [innerHTML]="w.icon"></span>
        <span class="widget-text">
          <span class="widget-title">{{ w.title }}</span>
          <span class="widget-sub">{{ w.sub }}</span>
          @if (meta(w.id); as m) {
            <span class="widget-meta">{{ m }}</span>
          }
        </span>
      </a>
    }
  </div>

</div>
