<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Abidjan Tennis Community</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" sizes="any" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="mask-icon" href="favicon.svg" color="#1F5A45">
  <meta name="theme-color" content="#1F5A45">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ATC">
  <!-- Google Identity Services — chargé pour « Continuer avec Google » (inerte si non configuré) -->
  <script src="https://accounts.google.com/gsi/client" async defer> </script>
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10243D;
      transition: opacity 0.32s ease;
    }
    #boot-splash.is-hidden { opacity: 0; pointer-events: none; }
    #boot-splash span {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -0.02em;
      color: #F4F5F1;
      animation: boot-pulse 1.4s ease-in-out infinite;
    }
    @keyframes boot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="boot-splash"><span>TenCI</span></div>
  <app-root></app-root>
</body>
</html>
